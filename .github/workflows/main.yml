name: Snyk Security Scan

on:
  push:
    branches:
      - master

jobs:
  snyk-scan:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYKTOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install and authenticate Snyk CLI
        run: |
          npm install -g snyk

      - name: Run a Snyk Open Source monitor (upload results to UI)
        run: snyk monitor --all-projects

      - name: Run a Snyk Code test with --report flag (upload results to UI)
        run: snyk code test --report --project-name=my-project || true

      - name: Build and monitor image with Snyk Container (upload results to UI)
        run: |
          docker build . -t imagename:tag
          snyk container monitor imagename:tag --file=Dockerfile

      - name: Run a Snyk IaC test with --report flag (upload results to UI)
        run: snyk iac test --report
